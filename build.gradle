plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.demo'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-web'
    // vault
    implementation 'org.springframework.cloud:spring-cloud-starter-vault-config:4.3.0'
    // 슬랙
    implementation 'com.slack.api:bolt-jakarta-servlet:1.45.3'
//    implementation("com.slack.api:bolt:1.45.3")
//    implementation("com.slack.api:bolt-servlet:1.45.3")
//    implementation("com.slack.api:bolt-jetty:1.45.3")

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
