<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구글 연동 성공</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 40px;
        }

        h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .redirect-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #4285f4;
        }

        .countdown {
            font-size: 18px;
            font-weight: bold;
            color: #4285f4;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #4A154B;
            color: white;
        }

        .btn-primary:hover {
            background: #611f69;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #007cba;
            color: white;
        }

        .btn-secondary:hover {
            background: #005a87;
            transform: translateY(-2px);
        }

        .manual-controls {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .small-text {
            font-size: 14px;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="success-icon">✓</div>
    <h2>구글 연동 성공!</h2>
    <p class="subtitle">Google 계정이 성공적으로 연동되었습니다.</p>

    <div class="redirect-info">
        <div class="countdown" id="countdown">5초 후 Slack으로 이동합니다...</div>
        <p>잠시만 기다려주세요. Slack 앱으로 자동 이동됩니다.</p>
    </div>

    <div class="manual-controls">
        <p><strong>수동으로 이동하기:</strong></p>
        <button class="btn btn-primary" onclick="openSlackApp()">
            Slack 앱 열기
        </button>
        <a href="https://slack.com/workspace-signin" class="btn btn-secondary" target="_blank">
            Slack 웹 열기
        </a>
    </div>

    <p class="small-text">
        Slack 앱이 설치되지 않은 경우, 웹 버전으로 이동됩니다.
    </p>
</div>

<script th:inline="javascript">
    let countdown = 5;
    const teamId =  /*[[${teamId}]]*/ null;

    // 카운트다운 및 자동 리다이렉트
    const countdownElement = document.getElementById('countdown');
    const countdownTimer = setInterval(() => {
        countdown--;
        if (countdown > 0) {
            countdownElement.textContent = `${countdown}초 후 Slack으로 이동합니다...`;
        } else {
            countdownElement.textContent = 'Slack으로 이동 중...';
            clearInterval(countdownTimer);
            openSlackApp();
        }
    }, 1000);

    function openSlackApp() {
        // 딥링크로 Slack 앱 열기 시도
        const slackDeepLink = 'slack://open';
        let url = slackDeepLink;
        // 모바일에서는 딥링크를 직접 시도
        if (teamId) {
            url = openSlackWorkspace(teamId)
        }
        if (isMobile()) {
            window.location.href = url;
            // 3초 후에도 페이지가 그대로 있으면 웹 버전으로 이동
            setTimeout(() => {
                window.location.href = 'https://slack.com/workspace-signin';
            }, 3000);
        } else {
            // 데스크톱에서는 iframe 트릭 사용
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = url;
            document.body.appendChild(iframe);
            // 잠시 후 iframe 제거 및 웹 버전으로 폴백
            setTimeout(() => {
                document.body.removeChild(iframe);
                // 선택적으로 웹 버전으로 이동 (주석 해제하면 활성화)
            }, 2000);
        }
    }

    function isMobile() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    // 특정 워크스페이스나 채널로 이동하려면 이 함수들을 사용하세요
    function openSlackWorkspace(teamId) {
        return `slack://open?team=${teamId}`;
    }

    function openSlackChannel(teamId, channelId) {
        const deepLink = `slack://channel?team=${teamId}&id=${channelId}`;
        window.location.href = deepLink;
    }

    // 페이지 로드 시 포커스 방지 (백그라운드에서 실행되는 경우)
    window.addEventListener('blur', () => {
        // 앱이 열렸을 가능성이 높으므로 카운트다운 중지
        clearInterval(countdownTimer);
        countdownElement.textContent = 'Slack 앱으로 이동 중...';
    });
</script>
</body>
</html>
